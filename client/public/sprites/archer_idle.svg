<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 80">
  <style>
    @keyframes sway { 0%,100%{transform:rotate(0deg)} 50%{transform:rotate(1.5deg)} }
    .c { animation: sway 1.5s ease-in-out infinite; transform-origin: 32px 76px; }
  </style>
  <g class="c">
    <!-- Hood outer -->
    <ellipse cx="32" cy="10" rx="16" ry="12" fill="#15803d"/>
    <!-- Hood tip -->
    <polygon points="26,4 38,4 32,0" fill="#166534"/>
    <!-- Hood shadow -->
    <rect x="20" y="12" width="24" height="6" rx="2" fill="#166534"/>
    <!-- Face -->
    <rect x="23" y="8" width="18" height="12" rx="3" fill="#fde68a"/>
    <!-- Eyes -->
    <rect x="26" y="12" width="4" height="3" fill="#111"/>
    <rect x="34" y="12" width="4" height="3" fill="#111"/>
    <!-- Smirk -->
    <path d="M27 19 Q32 22 37 19" stroke="#92400e" stroke-width="1.5" fill="none" stroke-linecap="round"/>
    <!-- Neck -->
    <rect x="29" y="20" width="6" height="4" fill="#fde68a"/>
    <!-- Tunic body -->
    <rect x="20" y="24" width="24" height="28" rx="2" fill="#22c55e"/>
    <!-- Tunic seam -->
    <rect x="30" y="24" width="4" height="28" fill="#16a34a"/>
    <!-- Tunic belt -->
    <rect x="20" y="46" width="24" height="4" fill="#78350f"/>
    <rect x="29" y="46" width="6" height="4" fill="#fbbf24"/>
    <!-- Quiver (on back, visible on left side) -->
    <rect x="8" y="26" width="6" height="20" rx="2" fill="#78350f"/>
    <!-- Arrow shafts in quiver -->
    <line x1="10" y1="24" x2="10" y2="28" stroke="#d4a574" stroke-width="1.5"/>
    <line x1="12" y1="22" x2="12" y2="26" stroke="#d4a574" stroke-width="1.5"/>
    <line x1="14" y1="24" x2="14" y2="28" stroke="#d4a574" stroke-width="1.5"/>
    <!-- Left shoulder -->
    <rect x="13" y="24" width="9" height="8" rx="2" fill="#16a34a"/>
    <!-- Left arm (holding bow) -->
    <rect x="10" y="30" width="9" height="16" rx="2" fill="#22c55e"/>
    <!-- Left hand -->
    <rect x="10" y="44" width="8" height="6" rx="2" fill="#fde68a"/>
    <!-- Bow (vertical) -->
    <path d="M6 26 Q2 48 6 70" stroke="#92400e" stroke-width="3" fill="none" stroke-linecap="round"/>
    <!-- Bowstring -->
    <line x1="6" y1="26" x2="6" y2="70" stroke="#d4a574" stroke-width="1" stroke-dasharray="2,2"/>
    <!-- Right shoulder -->
    <rect x="42" y="24" width="9" height="8" rx="2" fill="#16a34a"/>
    <!-- Right arm -->
    <rect x="45" y="30" width="9" height="16" rx="2" fill="#22c55e"/>
    <!-- Right hand -->
    <rect x="46" y="44" width="8" height="6" rx="2" fill="#fde68a"/>
    <!-- Left leg -->
    <rect x="21" y="52" width="10" height="20" rx="2" fill="#16a34a"/>
    <!-- Right leg -->
    <rect x="33" y="52" width="10" height="20" rx="2" fill="#16a34a"/>
    <!-- Left boot -->
    <rect x="18" y="68" width="16" height="9" rx="3" fill="#44403c"/>
    <!-- Right boot -->
    <rect x="30" y="68" width="16" height="9" rx="3" fill="#44403c"/>
  </g>
</svg>
