<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 80">
  <style>
    @keyframes pulse { 0%,100%{opacity:0.3} 50%{opacity:0.8} }
    @keyframes bob { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-1px)} }
    @keyframes burst { 0%{r:8;opacity:1} 100%{r:22;opacity:0} }
    .glow { animation: pulse 0.6s ease-in-out infinite; }
    .burst { animation: burst 0.8s ease-out infinite; }
    .c { animation: bob 0.6s ease-in-out infinite; }
  </style>
  <!-- Healing burst aura -->
  <circle cx="32" cy="40" r="22" fill="#10b981" class="burst"/>
  <ellipse cx="32" cy="44" rx="26" ry="24" fill="#10b981" opacity="0.2" class="glow"/>
  <!-- Healing rays -->
  <line x1="32" y1="14" x2="32" y2="4" stroke="#6ee7b7" stroke-width="2" class="glow"/>
  <line x1="20" y1="18" x2="12" y2="10" stroke="#6ee7b7" stroke-width="2" class="glow"/>
  <line x1="44" y1="18" x2="52" y2="10" stroke="#6ee7b7" stroke-width="2" class="glow"/>
  <line x1="14" y1="36" x2="4" y2="34" stroke="#a7f3d0" stroke-width="1.5" class="glow"/>
  <line x1="50" y1="36" x2="60" y2="34" stroke="#a7f3d0" stroke-width="1.5" class="glow"/>
  <g class="c">
    <!-- Hood -->
    <ellipse cx="32" cy="10" rx="14" ry="11" fill="#059669"/>
    <rect x="22" y="10" width="20" height="8" rx="2" fill="#047857"/>
    <!-- Face -->
    <rect x="24" y="8" width="16" height="12" rx="3" fill="#fde68a"/>
    <!-- Eyes (closed in prayer) -->
    <rect x="26" y="13" width="4" height="2" fill="#92400e"/>
    <rect x="34" y="13" width="4" height="2" fill="#92400e"/>
    <!-- Neck -->
    <rect x="29" y="20" width="6" height="4" fill="#fde68a"/>
    <!-- Robe -->
    <rect x="18" y="24" width="28" height="28" rx="2" fill="#10b981"/>
    <!-- Cross (glowing bright) -->
    <rect x="30" y="26" width="4" height="22" fill="#fff"/>
    <rect x="22" y="34" width="20" height="4" fill="#fff"/>
    <!-- Arms raised in casting -->
    <rect x="8" y="18" width="12" height="16" rx="3" fill="#10b981"/>
    <rect x="8" y="32" width="12" height="6" rx="2" fill="#fde68a"/>
    <rect x="44" y="18" width="12" height="16" rx="3" fill="#10b981"/>
    <rect x="44" y="32" width="12" height="6" rx="2" fill="#fde68a"/>
    <!-- Healing orbs at hands -->
    <circle cx="14" cy="32" r="5" fill="#6ee7b7" class="glow"/>
    <circle cx="50" cy="32" r="5" fill="#6ee7b7" class="glow"/>
    <!-- Staff (lowered / in aura) -->
    <rect x="51" y="22" width="4" height="40" rx="2" fill="#78350f"/>
    <!-- Cross glow center -->
    <circle cx="32" cy="36" r="5" fill="#fff" class="glow"/>
    <!-- Robe hem -->
    <polygon points="18,52 46,52 50,70 14,70" fill="#059669"/>
    <!-- Shoes -->
    <rect x="18" y="68" width="12" height="8" rx="3" fill="#1c1917"/>
    <rect x="34" y="68" width="12" height="8" rx="3" fill="#1c1917"/>
  </g>
</svg>
