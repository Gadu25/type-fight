<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 80">
  <style>
    @keyframes bob { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-2px)} }
    @keyframes glow { 0%,100%{opacity:0.3} 50%{opacity:0.6} }
    .c { animation: bob 1.2s ease-in-out infinite; }
    .halo { animation: glow 2s ease-in-out infinite; }
  </style>
  <!-- Soft healing aura -->
  <ellipse cx="32" cy="44" rx="24" ry="22" fill="#10b981" opacity="0.1" class="halo"/>
  <g class="c">
    <!-- Hood / head wrap -->
    <ellipse cx="32" cy="10" rx="14" ry="11" fill="#059669"/>
    <rect x="22" y="10" width="20" height="8" rx="2" fill="#047857"/>
    <!-- Face -->
    <rect x="24" y="8" width="16" height="12" rx="3" fill="#fde68a"/>
    <!-- Gentle eyes -->
    <rect x="26" y="12" width="4" height="3" fill="#1e1b4b"/>
    <rect x="34" y="12" width="4" height="3" fill="#1e1b4b"/>
    <!-- Warm smile -->
    <path d="M27 18 Q32 21 37 18" stroke="#92400e" stroke-width="1.5" fill="none" stroke-linecap="round"/>
    <!-- Neck -->
    <rect x="29" y="20" width="6" height="4" fill="#fde68a"/>
    <!-- Robe body -->
    <rect x="18" y="24" width="28" height="28" rx="2" fill="#10b981"/>
    <!-- Cross on chest -->
    <rect x="30" y="26" width="4" height="22" fill="#d1fae5"/>
    <rect x="22" y="34" width="20" height="4" fill="#d1fae5"/>
    <!-- Left sleeve -->
    <rect x="10" y="24" width="10" height="16" rx="3" fill="#10b981"/>
    <!-- Left hand -->
    <rect x="10" y="38" width="10" height="6" rx="2" fill="#fde68a"/>
    <!-- Right sleeve (holding staff) -->
    <rect x="44" y="24" width="10" height="16" rx="3" fill="#10b981"/>
    <!-- Right hand -->
    <rect x="45" y="38" width="9" height="6" rx="2" fill="#fde68a"/>
    <!-- Staff -->
    <rect x="51" y="4" width="4" height="58" rx="2" fill="#78350f"/>
    <!-- Staff cross top -->
    <rect x="44" y="10" width="18" height="4" rx="2" fill="#78350f"/>
    <!-- Healing glow on cross -->
    <circle cx="53" cy="12" r="5" fill="#6ee7b7" class="halo"/>
    <circle cx="53" cy="12" r="3" fill="#a7f3d0"/>
    <!-- Robe hem -->
    <polygon points="18,52 46,52 50,70 14,70" fill="#059669"/>
    <!-- Shoes -->
    <rect x="18" y="68" width="12" height="8" rx="3" fill="#1c1917"/>
    <rect x="34" y="68" width="12" height="8" rx="3" fill="#1c1917"/>
  </g>
</svg>
