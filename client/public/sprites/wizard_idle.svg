<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 80">
  <style>
    @keyframes float { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-4px)} }
    @keyframes orbpulse { 0%,100%{r:6; opacity:0.9} 50%{r:8; opacity:1} }
    @keyframes orbglow { 0%,100%{opacity:0.3} 50%{opacity:0.7} }
    .c { animation: float 2s ease-in-out infinite; }
    .orb { animation: orbpulse 1.5s ease-in-out infinite; }
    .orbhalo { animation: orbglow 1.5s ease-in-out infinite; }
  </style>
  <g class="c">
    <!-- Pointy hat brim -->
    <ellipse cx="32" cy="14" rx="16" ry="4" fill="#7e22ce"/>
    <!-- Hat cone -->
    <polygon points="24,14 40,14 32,0" fill="#9333ea"/>
    <!-- Hat star -->
    <polygon points="32,4 33,7 36,7 34,9 35,12 32,10 29,12 30,9 28,7 31,7" fill="#fbbf24" opacity="0.8"/>
    <!-- Face -->
    <rect x="24" y="14" width="16" height="14" rx="3" fill="#fde68a"/>
    <!-- Wise eyes -->
    <rect x="26" y="18" width="5" height="3" fill="#1e1b4b"/>
    <rect x="33" y="18" width="5" height="3" fill="#1e1b4b"/>
    <!-- Beard start -->
    <rect x="26" y="26" width="12" height="4" rx="2" fill="#e5e7eb"/>
    <!-- Neck / upper robe -->
    <rect x="28" y="28" width="8" height="4" fill="#7e22ce"/>
    <!-- Robe body (wide flowing) -->
    <rect x="14" y="32" width="36" height="30" rx="2" fill="#9333ea"/>
    <!-- Robe inner shadow -->
    <rect x="30" y="32" width="4" height="30" fill="#7e22ce" opacity="0.5"/>
    <!-- Robe hem (triangular flare) -->
    <polygon points="14,62 50,62 56,72 8,72" fill="#7e22ce"/>
    <!-- Robe detail lines -->
    <line x1="20" y1="38" x2="18" y2="62" stroke="#7e22ce" stroke-width="1.5" opacity="0.5"/>
    <line x1="44" y1="38" x2="46" y2="62" stroke="#7e22ce" stroke-width="1.5" opacity="0.5"/>
    <!-- Left sleeve -->
    <rect x="6" y="32" width="10" height="18" rx="3" fill="#9333ea"/>
    <!-- Left hand -->
    <rect x="6" y="48" width="10" height="6" rx="2" fill="#fde68a"/>
    <!-- Right sleeve (holding staff) -->
    <rect x="48" y="28" width="10" height="22" rx="3" fill="#9333ea"/>
    <!-- Right hand -->
    <rect x="49" y="46" width="9" height="6" rx="2" fill="#fde68a"/>
    <!-- Staff -->
    <rect x="53" y="0" width="4" height="62" rx="2" fill="#78350f"/>
    <!-- Staff top orb halo -->
    <circle cx="55" cy="6" r="10" fill="#c084fc" class="orbhalo"/>
    <!-- Staff top orb -->
    <circle cx="55" cy="6" r="6" fill="#e879f9" class="orb"/>
    <!-- Orb inner glow -->
    <circle cx="53" cy="4" r="2" fill="#fff" opacity="0.6"/>
    <!-- Robe feet (shoes peeking out) -->
    <rect x="18" y="70" width="12" height="8" rx="3" fill="#4c1d95"/>
    <rect x="34" y="70" width="12" height="8" rx="3" fill="#4c1d95"/>
  </g>
</svg>
