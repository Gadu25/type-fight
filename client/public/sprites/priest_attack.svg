<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 80">
  <style>
    @keyframes pulse { 0%,100%{opacity:0.2} 50%{opacity:0.7} }
    @keyframes bob { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-1px)} }
    @keyframes wave { 0%{r:6;opacity:1} 100%{r:20;opacity:0} }
    .glow { animation: pulse 0.5s ease-in-out infinite; }
    .wave { animation: wave 0.7s ease-out infinite; }
    .c { animation: bob 0.6s ease-in-out infinite; }
  </style>
  <!-- Cyan heal wave -->
  <circle cx="32" cy="38" r="6" fill="#06b6d4" class="wave"/>
  <ellipse cx="32" cy="40" rx="28" ry="26" fill="#06b6d4" opacity="0.15" class="glow"/>
  <!-- Rays -->
  <line x1="32" y1="10" x2="32" y2="0" stroke="#67e8f9" stroke-width="2" class="glow"/>
  <line x1="18" y1="16" x2="10" y2="8" stroke="#67e8f9" stroke-width="2" class="glow"/>
  <line x1="46" y1="16" x2="54" y2="8" stroke="#67e8f9" stroke-width="2" class="glow"/>
  <line x1="10" y1="34" x2="0" y2="32" stroke="#a5f3fc" stroke-width="1.5" class="glow"/>
  <line x1="54" y1="34" x2="64" y2="32" stroke="#a5f3fc" stroke-width="1.5" class="glow"/>
  <g class="c">
    <!-- Skull cap -->
    <ellipse cx="32" cy="9" rx="13" ry="10" fill="#e2e8f0"/>
    <rect x="22" y="12" width="20" height="6" rx="1" fill="#cbd5e1"/>
    <!-- Face (eyes closed in prayer) -->
    <rect x="24" y="8" width="16" height="14" rx="3" fill="#fde68a"/>
    <rect x="26" y="12" width="4" height="2" fill="#92400e"/>
    <rect x="34" y="12" width="4" height="2" fill="#92400e"/>
    <!-- Lips slightly parted (chanting) -->
    <rect x="28" y="18" width="8" height="3" rx="1" fill="#c084fc" opacity="0.5"/>
    <!-- White collar -->
    <rect x="26" y="22" width="12" height="5" rx="2" fill="#f1f5f9"/>
    <rect x="29" y="20" width="6" height="5" fill="#fde68a"/>
    <!-- Vestment -->
    <rect x="16" y="26" width="32" height="30" rx="2" fill="#e2e8f0"/>
    <!-- Stole glowing bright -->
    <rect x="28" y="26" width="8" height="30" fill="#06b6d4"/>
    <rect x="30" y="30" width="4" height="20" fill="#fff"/>
    <rect x="26" y="38" width="12" height="4" fill="#fff"/>
    <!-- Both arms raised casting -->
    <rect x="6" y="16" width="12" height="16" rx="3" fill="#e2e8f0"/>
    <rect x="6" y="30" width="12" height="6" rx="2" fill="#fde68a"/>
    <rect x="46" y="16" width="12" height="16" rx="3" fill="#e2e8f0"/>
    <rect x="46" y="30" width="12" height="6" rx="2" fill="#fde68a"/>
    <!-- Healing orbs at both hands -->
    <circle cx="12" cy="28" r="6" fill="#67e8f9" class="glow"/>
    <circle cx="52" cy="28" r="6" fill="#67e8f9" class="glow"/>
    <circle cx="12" cy="28" r="3" fill="#fff"/>
    <circle cx="52" cy="28" r="3" fill="#fff"/>
    <!-- Stole glow center -->
    <circle cx="32" cy="40" r="6" fill="#fff" class="glow"/>
    <!-- Hem -->
    <polygon points="16,56 48,56 52,72 12,72" fill="#cbd5e1"/>
    <!-- Shoes -->
    <rect x="18" y="70" width="12" height="8" rx="3" fill="#1c1917"/>
    <rect x="34" y="70" width="12" height="8" rx="3" fill="#1c1917"/>
  </g>
</svg>
