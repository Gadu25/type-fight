<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 80">
  <style>
    @keyframes pulse { 0%,100%{opacity:0.15} 50%{opacity:0.4} }
    @keyframes arrowflight { 0%{transform:translateX(0)} 100%{transform:translateX(20px);opacity:0} }
    @keyframes bob { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-1px)} }
    .glow { animation: pulse 0.6s ease-in-out infinite; }
    .arrow { animation: arrowflight 0.4s ease-in forwards; animation-iteration-count: infinite; }
    .c { animation: bob 0.6s ease-in-out infinite; }
  </style>
  <!-- Green glow -->
  <ellipse cx="32" cy="44" rx="26" ry="24" fill="#22c55e" class="glow"/>
  <g class="c">
    <!-- Hood outer -->
    <ellipse cx="32" cy="10" rx="16" ry="12" fill="#15803d"/>
    <polygon points="26,4 38,4 32,0" fill="#166534"/>
    <rect x="20" y="12" width="24" height="6" rx="2" fill="#166534"/>
    <!-- Face -->
    <rect x="23" y="8" width="18" height="12" rx="3" fill="#fde68a"/>
    <!-- Eyes (focused/squinting) -->
    <rect x="26" y="12" width="4" height="2" fill="#111"/>
    <rect x="34" y="12" width="4" height="2" fill="#111"/>
    <!-- Neck -->
    <rect x="29" y="20" width="6" height="4" fill="#fde68a"/>
    <!-- Tunic body -->
    <rect x="20" y="24" width="24" height="28" rx="2" fill="#22c55e"/>
    <rect x="30" y="24" width="4" height="28" fill="#16a34a"/>
    <!-- Belt -->
    <rect x="20" y="46" width="24" height="4" fill="#78350f"/>
    <rect x="29" y="46" width="6" height="4" fill="#fbbf24"/>
    <!-- Left shoulder -->
    <rect x="13" y="24" width="9" height="8" rx="2" fill="#16a34a"/>
    <!-- Left arm extended forward (holding bow horizontal) -->
    <rect x="6" y="30" width="16" height="8" rx="2" fill="#22c55e"/>
    <!-- Left hand -->
    <rect x="4" y="30" width="8" height="8" rx="2" fill="#fde68a"/>
    <!-- Bow (horizontal, drawn) -->
    <path d="M4 28 Q20 34 4 40" stroke="#92400e" stroke-width="3" fill="none" stroke-linecap="round"/>
    <!-- Bowstring drawn back -->
    <path d="M4 28 L36 34 L4 40" stroke="#d4a574" stroke-width="1" fill="none"/>
    <!-- Arrow nocked (pointing right) -->
    <g class="arrow">
      <line x1="36" y1="34" x2="64" y2="34" stroke="#d4a574" stroke-width="2" stroke-linecap="round"/>
      <!-- Arrowhead -->
      <polygon points="64,34 58,31 58,37" fill="#9ca3af"/>
      <!-- Arrow fletching -->
      <polygon points="36,34 30,30 32,34" fill="#22c55e"/>
      <polygon points="36,34 30,38 32,34" fill="#22c55e"/>
    </g>
    <!-- Right shoulder -->
    <rect x="42" y="24" width="9" height="8" rx="2" fill="#16a34a"/>
    <!-- Right arm pulled back (drawing string) -->
    <rect x="43" y="28" width="10" height="8" rx="2" fill="#22c55e"/>
    <!-- Right hand at ear -->
    <rect x="44" y="26" width="8" height="8" rx="2" fill="#fde68a"/>
    <!-- Left leg -->
    <rect x="21" y="52" width="10" height="20" rx="2" fill="#16a34a"/>
    <!-- Right leg -->
    <rect x="33" y="52" width="10" height="20" rx="2" fill="#16a34a"/>
    <!-- Left boot -->
    <rect x="18" y="68" width="16" height="9" rx="3" fill="#44403c"/>
    <!-- Right boot -->
    <rect x="30" y="68" width="16" height="9" rx="3" fill="#44403c"/>
  </g>
</svg>
