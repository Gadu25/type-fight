<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 80">
  <style>
    @keyframes pulse { 0%,100%{opacity:0.2} 50%{opacity:0.8} }
    @keyframes float { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-2px)} }
    @keyframes divinewave { 0%{r:8;opacity:1} 100%{r:30;opacity:0} }
    @keyframes halo { 0%,100%{opacity:0.7;stroke-width:3} 50%{opacity:1;stroke-width:5} }
    .glow { animation: pulse 0.4s ease-in-out infinite; }
    .wave { animation: divinewave 0.8s ease-out infinite; }
    .c { animation: float 1s ease-in-out infinite; }
    .halo { animation: halo 0.5s ease-in-out infinite; }
  </style>
  <!-- Divine burst -->
  <circle cx="32" cy="36" r="8" fill="#fbbf24" class="wave"/>
  <ellipse cx="32" cy="40" rx="30" ry="28" fill="#fbbf24" opacity="0.12" class="glow"/>
  <!-- Divine rays -->
  <line x1="32" y1="8" x2="32" y2="0" stroke="#fbbf24" stroke-width="3" class="glow"/>
  <line x1="16" y1="14" x2="6" y2="4" stroke="#fbbf24" stroke-width="2.5" class="glow"/>
  <line x1="48" y1="14" x2="58" y2="4" stroke="#fbbf24" stroke-width="2.5" class="glow"/>
  <line x1="8" y1="34" x2="0" y2="30" stroke="#fde68a" stroke-width="2" class="glow"/>
  <line x1="56" y1="34" x2="64" y2="30" stroke="#fde68a" stroke-width="2" class="glow"/>
  <line x1="10" y1="54" x2="2" y2="60" stroke="#fde68a" stroke-width="1.5" class="glow"/>
  <line x1="54" y1="54" x2="62" y2="60" stroke="#fde68a" stroke-width="1.5" class="glow"/>
  <g class="c">
    <!-- Radiant halo (bright) -->
    <circle cx="32" cy="7" r="14" fill="none" stroke="#fbbf24" stroke-width="3" class="halo"/>
    <circle cx="32" cy="7" r="10" fill="none" stroke="#fff" stroke-width="1.5" class="halo"/>
    <!-- Head -->
    <circle cx="32" cy="12" r="10" fill="#fde68a"/>
    <path d="M22 10 Q32 2 42 10" fill="#fef3c7" stroke="none"/>
    <!-- Eyes (open wide, bright) -->
    <rect x="27" y="12" width="4" height="4" fill="#78350f"/>
    <rect x="33" y="12" width="4" height="4" fill="#78350f"/>
    <!-- Eye divine glow -->
    <rect x="28" y="12" width="2" height="2" fill="#fbbf24" opacity="0.8"/>
    <rect x="34" y="12" width="2" height="2" fill="#fbbf24" opacity="0.8"/>
    <!-- Neck -->
    <rect x="29" y="22" width="6" height="4" fill="#fde68a"/>
    <!-- Robes (bright) -->
    <rect x="16" y="26" width="32" height="30" rx="3" fill="#fff"/>
    <!-- Gold accents -->
    <rect x="16" y="26" width="3" height="30" fill="#fbbf24"/>
    <rect x="45" y="26" width="3" height="30" fill="#fbbf24"/>
    <rect x="16" y="52" width="32" height="3" fill="#fbbf24"/>
    <!-- Cross (blazing) -->
    <rect x="30" y="28" width="4" height="22" fill="#fbbf24"/>
    <rect x="22" y="36" width="20" height="4" fill="#fbbf24"/>
    <!-- Cross center burst -->
    <circle cx="32" cy="38" r="5" fill="#fff" class="glow"/>
    <!-- Both arms raised fully, wings implied by rays -->
    <rect x="4" y="14" width="14" height="18" rx="3" fill="#fff"/>
    <rect x="2" y="30" width="16" height="6" rx="2" fill="#fde68a"/>
    <rect x="46" y="14" width="14" height="18" rx="3" fill="#fff"/>
    <rect x="46" y="30" width="16" height="6" rx="2" fill="#fde68a"/>
    <!-- Divine orbs at hands -->
    <circle cx="10" cy="26" r="7" fill="#fbbf24" class="glow"/>
    <circle cx="54" cy="26" r="7" fill="#fbbf24" class="glow"/>
    <circle cx="10" cy="26" r="4" fill="#fff"/>
    <circle cx="54" cy="26" r="4" fill="#fff"/>
    <!-- Hem -->
    <polygon points="16,56 48,56 54,74 10,74" fill="#fef3c7"/>
    <rect x="10" y="72" width="44" height="3" fill="#fbbf24"/>
    <!-- Sandals -->
    <rect x="18" y="72" width="12" height="6" rx="2" fill="#d97706"/>
    <rect x="34" y="72" width="12" height="6" rx="2" fill="#d97706"/>
  </g>
</svg>
