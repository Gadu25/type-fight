<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 80">
  <style>
    @keyframes float { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-4px)} }
    @keyframes halo { 0%,100%{opacity:0.5;stroke-width:2} 50%{opacity:1;stroke-width:3} }
    @keyframes glow { 0%,100%{opacity:0.3} 50%{opacity:0.6} }
    .c { animation: float 2.2s ease-in-out infinite; }
    .halo { animation: halo 2s ease-in-out infinite; }
    .aura { animation: glow 2s ease-in-out infinite; }
  </style>
  <!-- Divine golden aura -->
  <ellipse cx="32" cy="44" rx="26" ry="24" fill="#fbbf24" opacity="0.08" class="aura"/>
  <g class="c">
    <!-- Golden halo ring -->
    <circle cx="32" cy="7" r="13" fill="none" stroke="#fbbf24" stroke-width="2" class="halo"/>
    <circle cx="32" cy="7" r="10" fill="none" stroke="#fde68a" stroke-width="1" class="halo"/>
    <!-- Head -->
    <circle cx="32" cy="12" r="10" fill="#fde68a"/>
    <!-- Heavenly hair (white-gold) -->
    <path d="M22 10 Q32 2 42 10" fill="#fef3c7" stroke="none"/>
    <!-- Eyes (serene/gentle downward gaze) -->
    <rect x="27" y="13" width="4" height="3" fill="#78350f"/>
    <rect x="33" y="13" width="4" height="3" fill="#78350f"/>
    <!-- Peaceful smile -->
    <path d="M27 19 Q32 23 37 19" stroke="#92400e" stroke-width="1.5" fill="none" stroke-linecap="round"/>
    <!-- Neck -->
    <rect x="29" y="22" width="6" height="4" fill="#fde68a"/>
    <!-- White & gold robes -->
    <rect x="16" y="26" width="32" height="30" rx="3" fill="#fef9c3"/>
    <!-- Gold trim on robe -->
    <rect x="16" y="26" width="3" height="30" fill="#fbbf24"/>
    <rect x="45" y="26" width="3" height="30" fill="#fbbf24"/>
    <rect x="16" y="52" width="32" height="3" fill="#fbbf24"/>
    <!-- Gold cross on chest -->
    <rect x="30" y="28" width="4" height="22" fill="#fbbf24"/>
    <rect x="22" y="36" width="20" height="4" fill="#fbbf24"/>
    <!-- Gem on cross center -->
    <circle cx="32" cy="38" r="3" fill="#fff" class="aura"/>
    <!-- Left arm extended in blessing -->
    <rect x="6" y="26" width="12" height="18" rx="3" fill="#fef9c3"/>
    <rect x="4" y="42" width="14" height="6" rx="2" fill="#fde68a"/>
    <!-- Gold wrist trim left -->
    <rect x="4" y="42" width="14" height="2" fill="#fbbf24"/>
    <!-- Right arm extended -->
    <rect x="46" y="26" width="12" height="18" rx="3" fill="#fef9c3"/>
    <rect x="46" y="42" width="14" height="6" rx="2" fill="#fde68a"/>
    <!-- Gold wrist trim right -->
    <rect x="46" y="42" width="14" height="2" fill="#fbbf24"/>
    <!-- Floating golden particles -->
    <circle cx="12" cy="30" r="2" fill="#fbbf24" class="aura"/>
    <circle cx="52" cy="30" r="2" fill="#fbbf24" class="aura"/>
    <circle cx="8" cy="44" r="1.5" fill="#fde68a" class="aura"/>
    <circle cx="56" cy="44" r="1.5" fill="#fde68a" class="aura"/>
    <!-- Robe skirt (flowing) -->
    <polygon points="16,56 48,56 54,74 10,74" fill="#fef3c7"/>
    <rect x="10" y="72" width="44" height="3" fill="#fbbf24"/>
    <!-- Sandals -->
    <rect x="18" y="72" width="12" height="6" rx="2" fill="#d97706"/>
    <rect x="34" y="72" width="12" height="6" rx="2" fill="#d97706"/>
  </g>
</svg>
