<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 80">
  <style>
    @keyframes pulse { 0%,100%{opacity:0.2} 50%{opacity:0.5} }
    @keyframes bob { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-1px)} }
    .glow { animation: pulse 0.5s ease-in-out infinite; }
    .c { animation: bob 0.5s ease-in-out infinite; }
  </style>
  <!-- Glow aura -->
  <ellipse cx="32" cy="48" rx="28" ry="26" fill="#ef4444" class="glow"/>
  <g class="c">
    <!-- Horns -->
    <polygon points="18,8 11,0 21,4" fill="#7f1d1d"/>
    <polygon points="46,8 53,0 43,4" fill="#7f1d1d"/>
    <!-- Helmet -->
    <rect x="18" y="4" width="28" height="15" rx="3" fill="#991b1b"/>
    <!-- Visor slit -->
    <rect x="20" y="14" width="24" height="5" rx="1" fill="#1c1917"/>
    <!-- Face -->
    <rect x="22" y="6" width="20" height="11" rx="2" fill="#fca5a5"/>
    <!-- Angry brows -->
    <polygon points="22,10 28,10 26,8" fill="#7f1d1d"/>
    <polygon points="42,10 36,10 38,8" fill="#7f1d1d"/>
    <!-- Eyes (narrowed in rage) -->
    <rect x="24" y="10" width="5" height="2" fill="#111"/>
    <rect x="35" y="10" width="5" height="2" fill="#111"/>
    <!-- Neck -->
    <rect x="28" y="19" width="8" height="4" fill="#fca5a5"/>
    <!-- Body armor (leaning forward) -->
    <rect x="14" y="23" width="36" height="27" rx="2" fill="#ef4444"/>
    <!-- Armor cross -->
    <rect x="29" y="25" width="6" height="23" fill="#dc2626"/>
    <rect x="14" y="34" width="36" height="6" fill="#dc2626"/>
    <!-- Belt -->
    <rect x="14" y="47" width="36" height="5" fill="#7f1d1d"/>
    <rect x="29" y="47" width="6" height="5" fill="#fbbf24"/>
    <!-- Left shoulder pad -->
    <rect x="6" y="23" width="10" height="8" rx="3" fill="#b91c1c"/>
    <!-- Left arm (braced) -->
    <rect x="4" y="29" width="10" height="18" rx="2" fill="#ef4444"/>
    <!-- Right shoulder pad -->
    <rect x="48" y="23" width="10" height="8" rx="3" fill="#b91c1c"/>
    <!-- Right arm extended forward -->
    <rect x="48" y="28" width="16" height="10" rx="2" fill="#ef4444"/>
    <!-- Right hand -->
    <rect x="54" y="27" width="9" height="8" rx="2" fill="#fca5a5"/>
    <!-- Sword extended forward (angled down-right) -->
    <rect x="57" y="16" width="5" height="26" rx="2" fill="#e2e8f0" transform="rotate(45 57 28)"/>
    <rect x="58" y="18" width="2" height="12" rx="1" fill="#fff" opacity="0.7" transform="rotate(45 57 28)"/>
    <!-- Sword guard -->
    <rect x="50" y="26" width="16" height="5" rx="2" fill="#9ca3af"/>
    <!-- Sword handle -->
    <rect x="55" y="31" width="3" height="7" rx="1" fill="#78350f"/>
    <!-- Slash marks -->
    <line x1="52" y1="14" x2="64" y2="24" stroke="#fff" stroke-width="2.5" stroke-linecap="round" opacity="0.8"/>
    <line x1="50" y1="10" x2="60" y2="18" stroke="#fca5a5" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
    <line x1="54" y1="8" x2="64" y2="14" stroke="#fca5a5" stroke-width="1" stroke-linecap="round" opacity="0.4"/>
    <!-- Left leg -->
    <rect x="16" y="52" width="14" height="20" rx="2" fill="#b91c1c"/>
    <!-- Right leg -->
    <rect x="34" y="52" width="14" height="20" rx="2" fill="#b91c1c"/>
    <!-- Left boot -->
    <rect x="12" y="68" width="20" height="9" rx="3" fill="#1c1917"/>
    <!-- Right boot -->
    <rect x="32" y="68" width="20" height="9" rx="3" fill="#1c1917"/>
  </g>
</svg>
