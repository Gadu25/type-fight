<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 80">
  <style>
    @keyframes pulse { 0%,100%{opacity:0.2} 50%{opacity:0.55} }
    @keyframes bob { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-1px)} }
    .glow { animation: pulse 0.7s ease-in-out infinite; }
    .c { animation: bob 0.7s ease-in-out infinite; }
  </style>
  <!-- Blue holy glow -->
  <ellipse cx="28" cy="44" rx="28" ry="26" fill="#3b82f6" class="glow"/>
  <!-- Holy light rays -->
  <line x1="2" y1="30" x2="14" y2="38" stroke="#fbbf24" stroke-width="1.5" opacity="0.5" class="glow"/>
  <line x1="0" y1="44" x2="14" y2="44" stroke="#fbbf24" stroke-width="1.5" opacity="0.5" class="glow"/>
  <line x1="2" y1="56" x2="14" y2="50" stroke="#fbbf24" stroke-width="1.5" opacity="0.5" class="glow"/>
  <g class="c">
    <!-- Great helmet -->
    <rect x="19" y="2" width="26" height="18" rx="4" fill="#1d4ed8"/>
    <rect x="28" y="0" width="8" height="6" rx="2" fill="#1e40af"/>
    <!-- Visor cross -->
    <rect x="20" y="12" width="24" height="4" rx="1" fill="#1c1917"/>
    <rect x="29" y="4" width="6" height="16" rx="1" fill="#1c1917"/>
    <rect x="21" y="4" width="4" height="8" rx="1" fill="#93c5fd" opacity="0.5"/>
    <!-- Neck guard -->
    <rect x="24" y="20" width="16" height="5" rx="2" fill="#1d4ed8"/>
    <!-- Heavy body armor (leaning forward) -->
    <rect x="16" y="25" width="32" height="28" rx="3" fill="#2563eb"/>
    <!-- Gold cross on chest -->
    <rect x="29" y="26" width="6" height="26" fill="#fbbf24"/>
    <rect x="16" y="36" width="32" height="6" fill="#fbbf24"/>
    <!-- Pauldron left -->
    <rect x="6" y="24" width="12" height="10" rx="3" fill="#1e40af"/>
    <!-- Pauldron right -->
    <rect x="44" y="24" width="12" height="10" rx="3" fill="#1e40af"/>
    <!-- Left arm with shield RAISED and thrust forward -->
    <rect x="2" y="22" width="16" height="12" rx="2" fill="#2563eb"/>
    <!-- Shield raised high (bash pose) -->
    <rect x="0" y="14" width="16" height="24" rx="4" fill="#1d4ed8"/>
    <rect x="2" y="16" width="12" height="20" rx="3" fill="#3b82f6"/>
    <!-- Shield gold cross (bright) -->
    <rect x="7" y="17" width="3" height="18" fill="#fbbf24"/>
    <rect x="2" y="24" width="13" height="3" fill="#fbbf24"/>
    <!-- Shield impact flash -->
    <ellipse cx="8" cy="14" rx="6" ry="4" fill="#fbbf24" opacity="0.6" class="glow"/>
    <!-- Right arm with sword raised -->
    <rect x="46" y="24" width="12" height="20" rx="2" fill="#2563eb"/>
    <rect x="48" y="44" width="10" height="6" rx="2" fill="#93c5fd"/>
    <!-- Sword raised -->
    <rect x="52" y="14" width="5" height="30" rx="2" fill="#e2e8f0"/>
    <rect x="53" y="16" width="2" height="12" rx="1" fill="#fff" opacity="0.8"/>
    <rect x="48" y="42" width="14" height="4" rx="2" fill="#9ca3af"/>
    <!-- Belt -->
    <rect x="16" y="49" width="32" height="5" fill="#1e40af"/>
    <rect x="29" y="49" width="6" height="5" fill="#fbbf24"/>
    <!-- Left leg -->
    <rect x="18" y="54" width="12" height="20" rx="2" fill="#1d4ed8"/>
    <!-- Right leg -->
    <rect x="34" y="54" width="12" height="20" rx="2" fill="#1d4ed8"/>
    <!-- Sabatons -->
    <rect x="14" y="70" width="18" height="8" rx="3" fill="#1e3a8a"/>
    <rect x="32" y="70" width="18" height="8" rx="3" fill="#1e3a8a"/>
    <rect x="14" y="70" width="18" height="2" fill="#fbbf24" opacity="0.8"/>
    <rect x="32" y="70" width="18" height="2" fill="#fbbf24" opacity="0.8"/>
  </g>
</svg>
